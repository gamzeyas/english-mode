name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Integration (RLS) and e2e tests run against a real Supabase project. They
  # need repository secrets: NEXT_PUBLIC_SUPABASE_URL,
  # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY, ALLOWED_EMAILS.
  # E2E never calls Claude, so no ANTHROPIC_API_KEY is needed in CI.
  supabase:
    runs-on: ubuntu-latest
    needs: checks
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
    steps:
      - name: Skip without Supabase secrets
        if: env.SUPABASE_SECRET_KEY == ''
        run: echo "::notice::Supabase secrets not configured; skipping integration and e2e tests."
      - uses: actions/checkout@v4
        if: env.SUPABASE_SECRET_KEY != ''
      - uses: pnpm/action-setup@v4
        if: env.SUPABASE_SECRET_KEY != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_SECRET_KEY != ''
        with:
          node-version: 24
          cache: pnpm
      - if: env.SUPABASE_SECRET_KEY != ''
        run: pnpm install --frozen-lockfile
      - if: env.SUPABASE_SECRET_KEY != ''
        run: pnpm test:integration
      - if: env.SUPABASE_SECRET_KEY != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: env.SUPABASE_SECRET_KEY != ''
        run: pnpm test:e2e
